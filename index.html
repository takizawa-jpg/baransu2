    .container { max-width: 980px; width: 100%; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 4px solid #74b9ff; }

    .status-header { text-align: center; font-weight: bold; color: #d63031; margin-bottom: 15px; background: #ffeaa7; padding: 10px; border-radius: 12px; font-size: 1.2rem; border: 2px dashed #fdcb6e; }
    
    .main-layout { display: flex; flex-wrap: wrap; gap: 15px; }
    
    /* 左側：給食・選択エリア */
    .left-panel { flex: 1.2; min-width: 320px; display: flex; flex-direction: column; justify-content: space-between; }
    .guide-title { font-weight: bold; text-align: center; margin: 0 0 10px 0; color: #0984e3; font-size: 1.05rem; background: #e3f2fd; padding: 8px; border-radius: 8px; }
    
    .dishes-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .dish-card { background: #fffbe6; border: 2px solid #ffeaa7; padding: 10px 12px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .dish-title { font-size: 1.05rem; font-weight: bold; color: #2d3436; display: flex; align-items: center; justify-content: space-between; }
    .dish-tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; color: white; font-weight: bold; }
    .tag-yellow { background: #e17055; }
    .tag-red { background: #d63031; }
    .tag-green { background: #00b894; }

    /* 4つのボタンを並べるレイアウト */
    .radio-group { display: flex; justify-content: space-between; gap: 4px; }
    .radio-group input[type="radio"] { display: none; }
    .radio-label { flex: 1; text-align: center; background: white; border: 2px solid #ccc; padding: 8px 2px; border-radius: 8px; font-size: 0.78rem; font-weight: bold; cursor: pointer; transition: all 0.2s; color: #555; white-space: nowrap; }
    .radio-label:hover { border-color: #74b9ff; background: #f0f8ff; }
    .radio-group input[type="radio"]:checked + .radio-label { border-color: #0984e3; background: #74b9ff; color: white; box-shadow: 0 3px 0 #0984e3; transform: translateY(-2px); }

    /* 右側：縦型メーター群＆キャラクター */
    .right-panel { flex: 1.2; min-width: 320px; background: #fafafa; padding: 12px; border-radius: 16px; border: 2px solid #eee; display: flex; flex-direction: column; align-items: center; }

    .vertical-meters-container { display: flex; justify-content: space-around; width: 100%; height: 200px; background: #fff; border: 2px solid #e0e0e0; padding: 15px 5px 8px 5px; border-radius: 12px; margin-bottom: 10px; position: relative; }
    .v-meter-group { display: flex; flex-direction: column; align-items: center; height: 100%; width: 22%; position: relative; }
    
    .v-meter-track { position: relative; width: 34px; flex: 1; background: #f0f0f0; border-radius: 18px; border: 2px solid #ccc; overflow: hidden; display: flex; flex-direction: column-reverse; }

    .fill-red { background: linear-gradient(0deg, #e74c3c, #ff7675); }
